# Signs the iPhone + iPad app and uploads it to TestFlight, entirely on
# GitHub's Mac runner (no Mac of your own needed). Does nothing until these
# repository secrets exist (Settings > Secrets and variables > Actions):
#   APPLE_TEAM_ID   your 10-character team id (developer.apple.com > Membership)
#   ASC_KEY_ID      App Store Connect API key id (Admin role)
#   ASC_ISSUER_ID   the issuer id shown above the key list
#   ASC_KEY_P8      the full contents of the downloaded AuthKey_XXXX.p8
# The first run registers the bundle id; then create the app once in
# App Store Connect (My Apps > + > New App) and run this again.
name: TestFlight

on:
  push:
    branches: [master, cross-platform]
    paths:
      - "Parrot/**"
      - "project.yml"
      - "Package.resolved"
      - "Vendor/**"
      - ".github/workflows/testflight.yml"
      - ".github/scripts/asc.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  BUNDLE_ID: com.tectonic101.parrot

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::notice::TestFlight secrets aren't set yet, skipping. See the comment at the top of testflight.yml."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - name: Toolchain and API helper
        if: steps.secrets.outputs.ready == 'true'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
          brew install xcodegen
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q "pyjwt[crypto]"
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Register the bundle id and check the app record
        if: steps.secrets.outputs.ready == 'true'
        run: |
          PY="$RUNNER_TEMP/venv/bin/python"
          "$PY" .github/scripts/asc.py ensure-bundle-id "$BUNDLE_ID" "Parrot"
          if ! "$PY" .github/scripts/asc.py app-exists "$BUNDLE_ID"; then
            echo "::error::No app in App Store Connect uses $BUNDLE_ID yet. Create it once (My Apps > + > New App, platform iOS, pick $BUNDLE_ID as the Bundle ID), then re-run this workflow."
            exit 1
          fi

      - name: Generate Xcode project
        if: steps.secrets.outputs.ready == 'true'
        run: xcodegen generate

      - name: Archive (signed by Xcode cloud signing)
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -o pipefail
          xcodebuild -project Parrot.xcodeproj -scheme ParrotMobile \
            -destination 'generic/platform=iOS' -configuration Release \
            -archivePath "$RUNNER_TEMP/Parrot.xcarchive" \
            -derivedDataPath build/testflight \
            -skipPackagePluginValidation -skipMacroValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive 2>&1 | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Upload to TestFlight
        if: steps.secrets.outputs.ready == 'true'
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Parrot.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "::notice::Build ${{ github.run_number }} uploaded. It shows up in TestFlight after Apple finishes processing it."

      - name: Upload logs
        if: always() && steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: archive.log
          if-no-files-found: ignore

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
